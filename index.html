<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ionic App</title>
    
    <base href="/" />

    <!--
      Стили Ionic с CDN (не через import в JS → не «module script» из /node_modules).
      Ошибка MIME text/html для core.css бывает, если открыть приложение НЕ с URL dev-сервера Vite
      (например http://localhost:3020 с Bun без Vite): тогда вместо модулей отдаётся HTML.
      Запуск: npm run dev → открывать именно адрес из терминала (часто http://localhost:5173).
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/core.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/normalize.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/structure.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/typography.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/padding.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/float-elements.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/text-alignment.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/text-transformation.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/flex-utils.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/display.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/react@8/css/palettes/dark.system.css" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
